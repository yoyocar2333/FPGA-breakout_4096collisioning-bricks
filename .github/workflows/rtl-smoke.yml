name: rtl-smoke
on: [push, pull_request]
jobs:
  compile-physics-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y iverilog
      - run: iverilog -g2012 -s breakout_top -o /tmp/breakout src/vga_controller.v src/breakout_top.v
